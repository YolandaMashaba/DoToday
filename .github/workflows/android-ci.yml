name: Branch CI Check

on:
  push: # Triggers on push to ANY branch (and automatically on newly created branches)
  pull_request: # Tests PRs before merging

jobs:
  build-and-test:
    # Exclude tag pushes if they trigger a push event
    if: github.event_ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches Gradle dependencies automatically to speed up builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug
